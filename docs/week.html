<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This week's dinners</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--ink:#14213D;--navy:#14213D;--orange:#FF7A1A;--line:#E3DBC9;--mut:#5C5648}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
header{background:var(--navy);color:#fff;padding:36px 20px 22px}
.eye{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFB77A}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:28px;line-height:1.15;margin:6px 0}
.meta{font-size:14px;color:#DCE3F0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:700 14px 'Nunito Sans',sans-serif;color:var(--ink);min-height:44px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.serv{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}
.step{display:flex;align-items:center;gap:14px}
.step button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;font-size:22px;color:var(--navy)}
.step button.plus{background:var(--orange);border:0}
.step b{font-family:'Fredoka',sans-serif;font-size:26px;min-width:28px;text-align:center}
section{padding:18px 20px 4px}
h2{font-family:'Fredoka',sans-serif;font-weight:500;font-size:20px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:48px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid #B8AE96;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.row.done .box{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.row.done span.t{opacity:.45;text-decoration:line-through}
ol{padding:0;margin:0;list-style:none}
ol li{display:flex;gap:12px;margin-bottom:12px;line-height:1.45}
ol li i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.note{margin:0 20px;padding:12px 14px;border:1px dashed #B8AE96;border-radius:12px;font-size:14px;color:var(--mut)}
a.link{color:#2F5BFF}
.day{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.day .d{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.day .t{font-family:'Fredoka',sans-serif;font-weight:500;font-size:19px;margin:2px 0}
.day .m{font-size:14px;color:var(--mut)}
.day.today{border-color:var(--orange);border-width:2px}
.big{display:block;text-align:center;text-decoration:none;background:var(--orange);color:var(--navy);font-weight:700;border-radius:12px;padding:14px;margin:0 20px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eye">Week plan</div>
    <h1>This week's dinners</h1>
    <div class="meta">Tap a dinner for the ingredients and steps.</div>
  </header>
  <section><div id="days"></div></section>
  <a class="big" href="index.html#grocery">Grocery list for the week</a>
</div>
<script>
fetch("recipes.json").then(function(r){return r.json();}).then(function(d){
  var keys=["sun","mon","tue","wed","thu","fri","sat"],today=keys[new Date().getDay()];
  document.getElementById("days").innerHTML=d.days.map(function(x){
    return '<a class="day'+(x.key===today?' today':'')+'" href="index.html?d='+x.key+'"><div class="d">'+x.day+(x.key===today?' &middot; tonight':'')+'</div><div class="t">'+x.title+'</div><div class="m">About '+x.time+' &middot; '+x.cal+' calories per serving</div></a>';
  }).join("");
});
</script>
</body>
</html>
