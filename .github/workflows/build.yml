name: Build app

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/steady.jks"
      - name: Build APK
        env:
          KS_FILE: ${{ runner.temp }}/steady.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk steady-steps.apk
          gh release create "build-${{ github.run_number }}" steady-steps.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}"
